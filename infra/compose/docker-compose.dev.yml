# docker-compose.dev.yml
# Exposes internal services directly to the host for local development and
# testing without the api-gateway in front.
#
# Usage:
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml \
#                  --profile identity up -d
#
# Or via make:
#   make up-dev svc=identity
services:
  identity:
    ports:
      - "8081:8080"
